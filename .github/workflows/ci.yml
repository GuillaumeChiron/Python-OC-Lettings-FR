name: CI/CD

# Se déclenche sur toutes les branches et les pull requests
on:
  push:
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    env:
      # Clé factice, uniquement pour les tests (settings.py exige une SECRET_KEY)
      SECRET_KEY: cle-factice-pour-les-tests

    steps:
      - name: Récupération du code
        uses: actions/checkout@v7

      - name: Installation de Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip

      - name: Installation des dépendances
        run: pip install -r requirements.txt

      - name: Lint (flake8)
        run: flake8

      - name: Tests et couverture (minimum 80 %)
        run: pytest --cov=. --cov-fail-under=80

  containerize:
    needs: build-and-test
    # Uniquement sur un push vers master (pas sur les autres branches ni les PR)
    if: github.ref == 'refs/heads/master' && github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      - name: Récupération du code
        uses: actions/checkout@v7

      - name: Installation de Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Connexion à Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build et push de l'image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/oc-lettings:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/oc-lettings:${{ github.sha }}

  deploy:
    needs: containerize
    # Uniquement sur un push vers master (pas sur les autres branches ni les PR)
    if: github.ref == 'refs/heads/master' && github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      # Le Deploy Hook demande à Render de récupérer l'image latest et de redémarrer
      - name: Déploiement sur Render
        run: curl --fail --silent --show-error -X POST "${{ secrets.RENDER_DEPLOY_HOOK_URL }}"
