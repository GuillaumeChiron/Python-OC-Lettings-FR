name: CI/CD

# Se déclenche sur toutes les branches et les pull requests
on:
  push:
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    env:
      # Clé factice, uniquement pour les tests (settings.py exige une SECRET_KEY)
      SECRET_KEY: cle-factice-pour-les-tests

    steps:
      - name: Récupération du code
        uses: actions/checkout@v7

      - name: Installation de Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip

      - name: Installation des dépendances
        run: pip install -r requirements.txt

      - name: Lint (flake8)
        run: flake8

      - name: Tests et couverture (minimum 80 %)
        run: pytest --cov=. --cov-fail-under=80
